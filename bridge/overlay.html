<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AC Fame · Now Creating</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;color:#fff;font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif}
body{width:100vw;display:flex;align-items:flex-start;padding:8px}
.profile{position:relative;width:min(100%,624px);display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:20px;padding:14px 26px 14px 14px;background:linear-gradient(105deg,rgba(52,32,52,.94),rgba(15,14,23,.96) 53%);border:1px solid #e9d4ff24;border-radius:80px;box-shadow:inset 0 1px 0 #ffffff0a;transition:opacity .2s}
.profile[hidden]{display:none}.identity{min-width:0}
.name{min-width:0;margin:0 0 7px;font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 2px 4px #0005}
.account{display:flex;align-items:center;gap:8px;min-width:0}.tiktok{width:20px;height:20px;flex:none;fill:#f5efff}.handle{min-width:0;font-size:15px;color:#c1b6cb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;gap:14px;align-items:center;margin-top:11px;white-space:nowrap;font-size:10px;color:#9f93ac}.stats b{font-size:14px;font-weight:700;margin-right:4px;color:#eae2f2;font-variant-numeric:tabular-nums}.activity{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:1.1px;color:#5de2d1}.activity:before{content:"";display:inline-block;width:5px;height:5px;margin:0 6px 1px 0;border-radius:50%;background:currentColor}
.portrait{width:104px;height:104px;border:2px solid #d4b4f078;border-radius:50%;overflow:hidden;position:relative;background:#241c31;color:#d1b9e7;display:grid;place-items:center;font-size:38px;font-weight:700}.portrait img,.portrait canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.portrait canvas{image-rendering:auto}.portrait [hidden]{display:none}
@media(max-width:520px){.profile{grid-template-columns:80px minmax(0,1fr);gap:14px;padding:12px 20px 12px 12px}.portrait{width:80px;height:80px}.name{font-size:23px;margin-bottom:5px}.handle{font-size:13px}.tiktok{width:17px;height:17px}.stats{gap:10px;margin-top:9px;font-size:9px}.stats b{font-size:12px}.activity{font-size:8px;letter-spacing:.5px}}
@media(max-width:380px){.profile{grid-template-columns:64px minmax(0,1fr);gap:11px;padding:10px 17px 10px 10px}.portrait{width:64px;height:64px;font-size:26px}.name{font-size:19px}.handle{font-size:11px}.stats{flex-wrap:wrap;gap:5px 10px;margin-top:7px}.activity{margin-left:0}.stats b{font-size:11px}.account{gap:5px}.tiktok{width:14px;height:14px}}
@media(prefers-reduced-motion:reduce){.profile{transition:none}}
</style>
<section class="profile" id="profile" hidden aria-label="Creator currently being drawn" aria-live="polite">
  <div class="portrait"><span id="initial" aria-hidden="true">@</span><canvas id="pixels" width="32" height="32" hidden></canvas><img id="avatar" alt="" referrerpolicy="no-referrer" hidden></div>
  <div class="identity">
    <h1 class="name" id="nickname"></h1>
    <div class="account"><svg class="tiktok" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 1h-4.1v14.1a3 3 0 1 1-2.6-3V8a7.1 7.1 0 1 0 6.7 7.1V8a10 10 0 0 0 5.4 1.6V5.5A5.4 5.4 0 0 1 16.6 1Z"/></svg><span class="handle" id="handle"></span></div>
    <div class="stats"><span><b id="following">—</b>Following</span><span><b id="followers">—</b>Followers</span><span class="activity" id="activity">STANDBY</span></div>
  </div>
</section>
<script>
const params=new URLSearchParams(location.search),profile=document.querySelector('#profile'),avatar=document.querySelector('#avatar'),pixels=document.querySelector('#pixels');
const count=value=>Number.isSafeInteger(value)&&value>=0?value.toLocaleString('en-US'):'—';
let currentID='',lastSuccess=Date.now();
function paint(current,status='DISCONNECTED'){
  const idle=!current;
  if(idle)current={id:'idle:'+status,profile:{nickname:'Your next creator',handle:'',following:null,followers:null}};
  if(current.id===currentID)return;
  currentID=current.id;const p=current.profile;
  document.querySelector('#nickname').textContent=p.nickname||p.handle;
  document.querySelector('#handle').textContent=idle?(status==='LIVE'?'Waiting for the next name or portrait':'Your stream layout is ready'):'@'+p.handle;
  document.querySelector('#following').textContent=count(p.following);
  document.querySelector('#followers').textContent=count(p.followers);
  document.querySelector('#activity').textContent=idle?'STANDBY':(['necklace','donut','heart'].includes(current.kind)?'PAINTING':'WRITING');
  document.querySelector('#initial').textContent=idle?'AC':Array.from(p.nickname||p.handle||'@')[0];
  avatar.hidden=true;avatar.removeAttribute('src');pixels.hidden=true;
  if(current.pixels?.length===1024){
    const ctx=pixels.getContext('2d'),data=ctx.createImageData(32,32);
    current.pixels.forEach((v,i)=>{data.data[i*4]=v>>>16;data.data[i*4+1]=(v>>>8)&255;data.data[i*4+2]=v&255;data.data[i*4+3]=255;});ctx.putImageData(data,0,0);pixels.hidden=false;
  }
  if(p.avatarUrl){const id=current.id;avatar.onload=()=>{if(currentID===id)avatar.hidden=false;};avatar.onerror=()=>{avatar.hidden=true;};avatar.src=p.avatarUrl;}
  profile.hidden=false;
}
async function poll(){
  try{const response=await fetch('/overlay/state?'+new URLSearchParams({view:params.get('view')||''}),{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw Error('Unavailable');const state=await response.json();paint(state.current,state.status);lastSuccess=Date.now();}
  catch{if(Date.now()-lastSuccess>8000){profile.hidden=true;currentID='';}}
  setTimeout(poll,500);
}
paint(null);
if(params.get('preview')==='1')paint({id:'preview',profile:{nickname:'Overlay preview',handle:'your_channel',following:null,followers:null}});else poll();
</script>
</html>
